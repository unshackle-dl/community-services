endpoints:
  login: https://api.mnetplus.world/user/v1/public/auth/login
  media_events: https://api.mnetplus.world/media/v1/public/media-events
  show: https://api.mnetplus.world/media/v1/public/media-events/{show_id}
  archives: https://api.mnetplus.world/media/v1/public/videos/archives
  video: https://api.mnetplus.world/media/v1/public/guests/videos/{video_id}

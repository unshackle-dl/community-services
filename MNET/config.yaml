  cues: https://api.mnetplus.world/media/v1/public/videos/{video_id}/captions/{caption_id}/cues

cdn_domain: video.cdn.mnetplus.world

headers:
  Origin: https://www.mnetplus.world
  Referer: https://www.mnetplus.world/
  X-Lang-Country: en:US
